name: "Build Blog"
run-name: "Build Blog: ${{ github.ref_name }}"

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  IMAGE: onlyoffice/blog

jobs:
  build:
    name: "Build image: ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # web server group needs write access inside wp-content
      - name: Fix wp-content permissions
        run: chmod -R g+rwX wp-content

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

  update-test:
    name: Update test stand
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - name: Trigger Flux webhook receiver
        shell: bash
        run: |
          blog_webhook_hash=$(printf 'blog-webhook' | openssl dgst -sha256 -r -hmac "${{ secrets.BLOG_WEBHOOK_TOKEN }}" | awk '{print $1}')
          curl -f ${{ secrets.BLOG_WEBHOOK_URL }} -X POST -H "X-Signature: sha256=${blog_webhook_hash}" -d 'blog-webhook'
